name: Build MLWBD (Windows)

# Packages https://mlwbd-newsite.blogspot.com/ into a Windows .msi with Pake.
# Run it from the Actions tab (or it runs when this file changes).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-mlwbd-windows.yml

permissions:
  contents: read

env:
  APP_URL: https://mlwbd-newsite.blogspot.com/
  APP_NAME: MLWBD

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js Environment
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build CLI
        run: pnpm run cli:build

      - name: Build App
        timeout-minutes: 30
        shell: pwsh
        run: |
          node dist/cli.js $env:APP_URL --name $env:APP_NAME --width 1280 --height 800 --app-version 1.0.0
          git checkout -- src-tauri/Cargo.lock

      - name: Upload MSI
        uses: actions/upload-artifact@v6
        with:
          name: MLWBD-Windows
          path: MLWBD.msi
          retention-days: 30
